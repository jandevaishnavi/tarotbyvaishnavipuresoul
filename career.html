<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarot by Vaishnavi | Pure Soul</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;font-family:Georgia,"Times New Roman",serif;background:linear-gradient(135deg,#ff7200,#ff9d3d,#fff4e6,#fff);color:#662900;overflow-x:hidden}
header{width:100%;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.4);position:sticky;top:0;z-index:100}
.logo{color:#fff;font-size:clamp(1.4rem,4vw,2.2rem);font-weight:bold;text-shadow:0 3px 8px rgba(100,40,0,.25)}
.logo span{display:block;color:skyblue;font-size:.55em;letter-spacing:4px;margin-top:4px}
.menu-button,.start-button{border:none;padding:12px 20px;border-radius:30px;background:#fff;color:#df5b00;font-weight:bold;cursor:pointer;box-shadow:0 5px 15px rgba(120,50,0,.2)}
.hero{min-height:calc(100vh - 85px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px}
.hero h1{color:#fff;font-size:clamp(2.3rem,8vw,5rem);text-shadow:0 4px 12px rgba(120,40,0,.25)}
.hero h1 span{color:skyblue}
.hero p{max-width:650px;margin:20px auto 30px;line-height:1.7;font-size:clamp(1rem,2.5vw,1.2rem);color:#783600}
.start-button{padding:15px 30px;font-size:1rem;transition:.3s}
.start-button:hover{transform:scale(1.05)}
#careerSection{display:none;padding:70px 4% 100px;text-align:center}
#careerSection.show{display:block;animation:appear .7s ease}
@keyframes appear{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.section-title{color:#fff;font-size:clamp(2rem,6vw,3.5rem);text-shadow:0 3px 10px rgba(120,40,0,.2)}
.section-subtitle{margin:12px 0 45px;color:#7d3500}
.card-container{max-width:1250px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:25px;justify-items:center}
.tarot-wrapper{width:125px;height:180px;perspective:1000px;cursor:pointer}
.tarot-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.tarot-wrapper.flipped .tarot-card{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:14px;box-shadow:0 10px 25px rgba(140,55,0,.25);border:2px solid rgba(255,255,255,.7)}
.card-front{background:linear-gradient(145deg,#fff,#fff0df)}
.card-number{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ff7800,#ffb45c);color:#fff;font-size:1.6rem;font-weight:bold;box-shadow:0 5px 12px rgba(180,70,0,.2)}
.card-back{transform:rotateY(180deg);background:linear-gradient(145deg,#ff7200,#ffb347);color:#fff;text-align:center}
.card-back .symbol{font-size:1.5rem;margin-bottom:7px}
.card-back h3{font-size:.85rem;margin-bottom:8px}
  .card-back p {
  font-size: 0.62rem;
  line-height: 1.3;
  width: 100%;
  max-height: 105px;
  overflow-y: auto;
  overflow-wrap: anywhere;
  word-break: normal;
  padding: 0 3px;
  }
footer{text-align:center;padding:25px;color:#853b00;font-size:.85rem}
@media(max-width:600px){header{padding:15px 4%}.logo{font-size:1.35rem}.menu-button{padding:9px 12px;font-size:.72rem}.hero h1{font-size:2.5rem}.card-container{grid-template-columns:repeat(2,125px);justify-content:center;gap:20px}#careerSection{padding:50px 10px 70px}}
@media(max-width:350px){.card-container{grid-template-columns:repeat(2,105px)}.tarot-wrapper{width:105px;height:160px}.card-number{width:58px;height:58px;font-size:1.4rem}.card-back p{font-size:.59rem}}

.card-back {
  transform: rotateY(180deg);
  background: linear-gradient(145deg, #ff7200, #ffb347);
  color: pink;
  font-weight:bolder;
  text-align: center;
  overflow: hidden;
}
</style>
</head>
<body>
<header>
<div class="logo">Tarot by Vaishnavi<span>PURE SOUL</span></div>
<button class="menu-button" onclick="openCareerTarot()">Career Tarot Card</button>
</header>

<section class="hero" id="home">
<h1>Tarot by Vaishnavi <span>Pure Soul</span></h1>
<p>Take a moment, clear your mind and trust your intuition. Choose a card and discover the career message waiting for you.</p>
<button class="start-button" onclick="openCareerTarot()">✨ Choose Your Career Card</button>
</section>

<section id="careerSection">
<h2 class="section-title">Career Tarot</h2>
<p class="section-subtitle">Trust your intuition. Choose one card.</p>
<div class="card-container" id="cardContainer"></div>
</section>

<footer>Tarot by Vaishnavi • Pure Soul ✨</footer>

['Two of Swords','⚖️','You may be stuck between two career choices. Gather more information instead of rushing. Once you understand the facts, the decision can become easier.'],

['Four of Pentacles','💎',"You may strongly desire career and financial security. Stability is valuable, but don't allow fear of change to prevent you from pursuing a better opportunity."],
['Five of Pentacles','🌧️','A period of financial or career difficulty may be testing your confidence. Remember that temporary struggle does not determine your long-term future.'],
['Six of Pentacles','🤲','Support may come through a helpful person, mentor, employer or professional connection. Be willing to both receive assistance and support others when you can.'],
['Seven of Pentacles','🌱','Your career growth requires patience. The effort you are putting in may not show immediate results, but consistent work can produce meaningful rewards over time.'],
['Eight of Pentacles','🔨','Skill development is your key to progress. Practice, training and consistent improvement can significantly strengthen your chances of achieving your career goal.'],
['Nine of Pentacles','🌿','Independence and financial confidence are possible. Your own skills and dedication can eventually create a professional life where you feel secure and capable.'],
['Ten of Pentacles','🏡','Long-term career and financial stability are highlighted. Build patiently and make choices that support not only immediate income but also your future security.'],
['Page of Pentacles','📚','A learning opportunity may become the beginning of a valuable career path. Invest in practical skills and stay open to starting small.'],
['Knight of Pentacles','🐢','Slow and steady progress is your strength. Keep following your plan consistently. Your reliability and discipline can eventually create strong professional results.'],
['Queen of Pentacles','🌿','You have the ability to create both career stability and financial security. Practical thinking, patience and good organization can help you build a comfortable professional life.'],
['King of Pentacles','👑','Strong financial and professional achievement is possible through discipline and smart decisions. Your career can grow into a position of stability, authority and abundance.']];

const container=document.getElementById("cardContainer");

tarotCards.forEach((card,index)=>{
  const wrapper=document.createElement("div");
  wrapper.className="tarot-wrapper";
  wrapper.innerHTML=`
    <div class="tarot-card">
      <div class="card-face card-front">
        <div class="card-number">${index+1}</div>
      </div>
      <div class="card-face card-back">
        <div class="symbol">${card[1]}</div>
        <h3>${card[0]}</h3>
        <p>${card[2]}</p>
      </div>
    </div>`;
  wrapper.addEventListener("click",()=>wrapper.classList.toggle("flipped"));
  container.appendChild(wrapper);
});

function openCareerTarot(){
  const section=document.getElementById("careerSection");
  section.classList.add("show");
  setTimeout(()=>section.scrollIntoView({behavior:"smooth"}),100);
}
</script>
</body>
</html>
